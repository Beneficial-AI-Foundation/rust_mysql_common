name: Lean project builds

on:
  push:
    paths: &paths
      - "formal/**"
      - ".github/workflows/lean-build.yml"
  pull_request:
    paths: *paths

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache lake packages and build
        uses: actions/cache@v4
        with:
          path: |
            formal/.lake/packages
            formal/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-

      - name: Fetch the Mathlib cache
        working-directory: formal
        run: lake exe cache get

      - name: Build (warnings, including sorry, are errors; runs the axiom checks in Specs/)
        working-directory: formal
        run: lake build --wfail
