[workspace]
members = ["derive"]

[package]
authors = ["blackbeam <aikorsky@gmail.com>"]
name = "mysql_common"
description = "MySql protocol primitives"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/blackbeam/rust_mysql_common"
documentation = "https://docs.rs/mysql_common"
repository = "https://github.com/blackbeam/rust_mysql_common"
keywords = ["mysql", "database"]
categories = ["database"]

# * Invoke `cargo readme > README.md` if relevant!
version = "0.38.2"

edition = "2024"
exclude = [
    "/lib",
    "/proptest-regressions",
    "/test-data",
    "/wrapper.cc",
    "/wrapper.hh",
    "README.tpl",
    ".github",
]

[badges]
travis-ci = { repository = "blackbeam/rust_mysql_common" }

[dependencies]
base64 = "0.22"
bigdecimal = { version = ">=0.3, <0.5", optional = true }
bitflags = "2.3"
bitvec = { version = "1.0", optional = true }
byteorder = "1"
bytes = "1.0"
chrono = { version = "0.4.20", default-features = false, features = [
    "clock",
    "serde",
], optional = true }
crc32fast = "1.2"
curve25519-dalek = { version = "5", optional = true }
ed25519-dalek = { version = "3", features = ["rand_core"], optional = true }
flate2 = { version = "1.0", default-features = false }
frunk = { version = ">=0.5, <0.6", optional = true }
getrandom = { version = "0.4", features = ["std"] }
hex = "0.4"
num-bigint = { version = ">=0.5, <0.6" }
num-traits = { version = "0.2", features = ["i128"] }
pbkdf2 = { version = "0.13", default-features = false, features = [
    "hmac",
    "sha2",
], optional = true }
rand = { version = "0.10", optional = true }
regex = "1.5"
rust_decimal = { version = "1.0", optional = true }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", default-features = false, features = [
    "parsing",
    "macros",
], optional = true }
uuid = { version = "1" }
saturating = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

mysql-common-derive = { path = "derive", version = "0.32.0", optional = true }
btoi = "0.5"
zstd = { version = "0.13", optional = true }

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
proptest = "1.0"
unic-langid = { version = "0.9.4" }

[build-dependencies]
bindgen = { version = "0.72", default-features = false, features = [
    "runtime",
], optional = true }
cc = { version = "1.0", optional = true }
cmake = { version = "0.1", optional = true }
subprocess = { version = "1.2", optional = true }

[profile.bench]
debug = true

[profile.features-subsets]
inherits = "test"
debug = false
strip = "debuginfo"
incremental = false

[features]
default = ["flate2/zlib", "derive"]
test = ["derive", "time", "bindgen", "dep:cc", "dep:cmake", "dep:subprocess"]
derive = ["mysql-common-derive"]
binlog = ["bitvec", "dep:zstd"]
nightly = ["test"]

bigdecimal = ['dep:bigdecimal']
bitvec = ['dep:bitvec']
chrono = ['dep:chrono']
frunk = ['dep:frunk']
rust_decimal = ['dep:rust_decimal']
time = ['dep:time']
client_ed25519 = ['dep:curve25519-dalek']
client_parsec = ['dep:ed25519-dalek', 'dep:pbkdf2', 'dep:rand']

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
no-default-features = true
features = [
    "flate2/zlib",
    "time",
    "rust_decimal",
    "chrono",
    "bigdecimal",
    "derive",
    "binlog",
    "frunk",
]

# Charon settings for the Aeneas/Lean verification (see VERIFICATION.md and scripts/).
[package.metadata.charon]
start_from = [
  # src/io.rs: the inherent methods of ParseBuf, and the BufMutExt methods.
  "mysql_common::io::ParseBuf::_",
  "mysql_common::io::BufMutExt::put_lenenc_int",
  "mysql_common::io::BufMutExt::put_lenenc_str",
  "mysql_common::io::BufMutExt::put_u24_le",
  "mysql_common::io::BufMutExt::put_i24_le",
  "mysql_common::io::BufMutExt::put_u48_le",
  "mysql_common::io::BufMutExt::put_u56_le",
  "mysql_common::io::BufMutExt::put_i56_le",
  "mysql_common::io::BufMutExt::put_u8_str",
  "mysql_common::io::BufMutExt::put_u32_str",
  # src/misc/mod.rs: length-encoded and variable-length integer helpers.
  "mysql_common::misc::lenenc_int_len",
  "mysql_common::misc::lenenc_str_len",
  "mysql_common::misc::read_varlen_uint",
  "mysql_common::misc::write_varlen_uint",
  "mysql_common::misc::varlen_uint_size",
  "mysql_common::misc::unexpected_buf_eof",
  # src/misc/raw/mod.rs (the impls for `&[u8]`, `[u8]`, `[u8; N]` and `f64` are not on named
  # types, which `start_from` patterns cannot express: they are marked `#[verify::start_from]` by
  # translation-patches/08-start-from-attributes.patch, see `start_from_attribute` below)
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::Skip<_>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::Skip<_>}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::io::ParseBuf}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::Either<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::Either<_, _>}",
  "mysql_common::misc::raw::Either::_",
  # src/misc/raw/int.rs
  "{impl mysql_common::misc::raw::int::IntRepr for _}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::int::RawInt<_>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::int::RawInt<_>}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::int::ConstU8<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::int::ConstU8<_, _>}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::int::ConstU32<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::int::ConstU32<_, _>}",
  "{impl core::ops::deref::Deref for mysql_common::misc::raw::int::RawInt<_>}",
  "{impl core::ops::deref::DerefMut for mysql_common::misc::raw::int::RawInt<_>}",
  "mysql_common::misc::raw::int::RawInt::_",
  "mysql_common::misc::raw::int::ConstU8::_",
  "mysql_common::misc::raw::int::ConstU32::_",
  # src/misc/raw/bytes.rs (RawBytes::as_str and RawBytes::into_owned are out of scope)
  "{impl mysql_common::misc::raw::bytes::BytesRepr for _}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::bytes::RawBytes<_>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::bytes::RawBytes<_>}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::bytes::ConstBytes<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::bytes::ConstBytes<_, _>}",
  "mysql_common::misc::raw::bytes::RawBytes::new",
  "mysql_common::misc::raw::bytes::RawBytes::is_empty",
  "mysql_common::misc::raw::bytes::RawBytes::len",
  "mysql_common::misc::raw::bytes::RawBytes::as_bytes",
  # src/misc/raw/seq.rs
  "{impl mysql_common::misc::raw::seq::SeqRepr for _}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::seq::Seq<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::seq::Seq<_, _>}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::seq::RawSeq<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::seq::RawSeq<_, _>}",
  "{impl core::ops::deref::Deref for mysql_common::misc::raw::seq::Seq<_, _>}",
  "mysql_common::misc::raw::seq::RawSeq::_",
  # src/misc/raw/flags.rs
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::flags::RawFlags<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::flags::RawFlags<_, _>}",
  "mysql_common::misc::raw::flags::RawFlags::_",
  # src/misc/raw/_const.rs
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::_const::Const<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::_const::Const<_, _>}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::misc::raw::_const::RawConst<_, _>}",
  "{impl mysql_common::proto::MySerialize for mysql_common::misc::raw::_const::RawConst<_, _>}",
  "{impl core::ops::deref::Deref for mysql_common::misc::raw::_const::Const<_, _>}",
  "{impl core::ops::deref::DerefMut for mysql_common::misc::raw::_const::Const<_, _>}",
  "{impl core::ops::deref::Deref for mysql_common::misc::raw::_const::RawConst<_, _>}",
  "{impl core::ops::deref::DerefMut for mysql_common::misc::raw::_const::RawConst<_, _>}",
  "mysql_common::misc::raw::_const::Const::_",
  "mysql_common::misc::raw::_const::RawConst::_",
  # src/value/mod.rs: Value and its binary/text wire format.
  "mysql_common::value::Value",
  "{impl mysql_common::proto::MySerialize for mysql_common::value::Value}",
  "{impl mysql_common::proto::MyDeserialize for mysql_common::value::ValueDeserializer<_>}",
  "mysql_common::value::Value::bin_len",
  "mysql_common::value::Value::deserialize_text",
  "mysql_common::value::Value::deserialize_tiny",
  "mysql_common::value::Value::deserialize_short",
  "mysql_common::value::Value::deserialize_long",
  "mysql_common::value::Value::deserialize_longlong",
  "mysql_common::value::Value::deserialize_datetime",
  "mysql_common::value::Value::deserialize_time",
  "mysql_common::value::Value::deserialize_bin",
  # src/value/convert/ (mod.rs, uuid.rs, chrono.rs, time.rs, bigint.rs, decimal.rs,
  # bigdecimal.rs): every item, minus the exclusions below. `mysql_common::value::convert::trusted` (added by
  # translation-patches/40) is opaque, see below.
  "mysql_common::value::convert",
  # src/value/json/serde_integration.rs (`Serialized`/`Deserialized` are reached from it; the
  # serde derives in json/mod.rs are out of scope).
  "mysql_common::value::json::serde_integration",
]
# uuid: `Uuid` (a `[u8; 16]` tuple struct with a private field) and `Uuid::as_bytes`/`from_bytes`
# are translated from uuid's own MIR rather than being opaque (`from_bytes` has no MIR body and is
# modelled exactly in FunsExternal.lean).
include = ["uuid::Uuid", "uuid::_::as_bytes", "uuid::_::from_bytes"]
start_from_attribute = ["verify::start_from"]
exclude = [
  # src/value/convert: formatting, and the derived `Clone`/`PartialEq`/`PartialOrd` impls, are out
  # of scope (`Debug for Value`, reached from thiserror's `Display for FromValueError`, needs
  # `str::pattern`, which Aeneas cannot translate).
  "{impl core::fmt::Debug for mysql_common::value::convert::_}",
  "{impl core::fmt::Display for mysql_common::value::convert::_}",
  "{impl core::error::Error for mysql_common::value::convert::_}",
  "mysql_common::value::convert::{core::clone::Clone<_>}",
  "mysql_common::value::convert::{core::cmp::PartialEq<_, _>}",
  "mysql_common::value::convert::{core::cmp::PartialOrd<_, _>}",
  # src/value/convert/mod.rs: the conversions from/to `Arc<..>`, `Rc<..>`, `Box<..>` and
  # `Cow<'static, str>` are out of scope (they go through std conversions into shared/boxed
  # allocations, and `ToOwned for str`, which Aeneas does not model). (`Cow<[u8]>`, `[u8; N]`,
  # `Option<T>` and `Value` itself are translated.)
  "mysql_common::value::convert::{core::convert::TryFrom<alloc::sync::Arc<_, _>, _>}",
  "mysql_common::value::convert::{core::convert::TryFrom<alloc::rc::Rc<_, _>, _>}",
  "mysql_common::value::convert::{core::convert::TryFrom<alloc::boxed::Box<_, _>, _>}",
  "mysql_common::value::convert::{core::convert::TryFrom<alloc::borrow::Cow<str>, _>}",
  "mysql_common::value::convert::{mysql_common::value::convert::FromValue<alloc::sync::Arc<_, _>>}",
  "mysql_common::value::convert::{mysql_common::value::convert::FromValue<alloc::rc::Rc<_, _>>}",
  "mysql_common::value::convert::{mysql_common::value::convert::FromValue<alloc::boxed::Box<_, _>>}",
  "mysql_common::value::convert::{mysql_common::value::convert::FromValue<alloc::borrow::Cow<str>>}",
  "mysql_common::value::convert::{core::convert::From<mysql_common::value::Value, alloc::sync::Arc<_, _>>}",
  "mysql_common::value::convert::{core::convert::From<mysql_common::value::Value, alloc::rc::Rc<_, _>>}",
  "mysql_common::value::convert::{core::convert::From<mysql_common::value::Value, alloc::boxed::Box<_, _>>}",
  # src/value/json/serde_integration.rs: the impls for `Deserialized<T: DeserializeOwned>` and
  # `Serialized<T: Serialize>`. Their trait bounds bring in serde's `Serialize`/`Serializer` and
  # `Deserialize`/`Deserializer` trait declarations, which are mutually recursive: Aeneas cannot
  # give them a Lean model. (The `serde_json::Value` impls are translated.)
  "mysql_common::value::json::serde_integration::{core::convert::TryFrom<mysql_common::value::convert::ParseIr<mysql_common::value::json::Deserialized<_>>, _>}",
  "mysql_common::value::json::serde_integration::{core::convert::From<mysql_common::value::json::Deserialized<_>, mysql_common::value::convert::ParseIr<_>>}",
  "mysql_common::value::json::serde_integration::{core::convert::From<mysql_common::value::Value, mysql_common::value::convert::ParseIr<mysql_common::value::json::Deserialized<_>>>}",
  "mysql_common::value::json::serde_integration::{mysql_common::value::convert::FromValue<mysql_common::value::json::Deserialized<_>>}",
  "mysql_common::value::json::serde_integration::{core::convert::From<mysql_common::value::Value, mysql_common::value::json::Serialized<_>>}",
]
opaque = [
  # Construct an `io::Error`, which goes through `Box<dyn Error + Send + Sync>`: Aeneas does not
  # support `dyn` types. Specs only ever say that a function returns `Err _`.
  "mysql_common::misc::io_error_msg",
  "mysql_common::misc::io_error_from",
  # The trust boundary of the value conversions (translation-patches/40): one function per
  # dependency operation; each has a Lean model or axiom in FunsExternal.lean.
  "mysql_common::value::convert::trusted",
  # `serde_json::Value` is only passed to/from `trusted`; its `Object(Map<String, Value>)` variant
  # nests the type in an opaque map, which a Lean inductive cannot express.
  "serde_json::value::Value",
]

[package.metadata.charon.rustc]
# Lets rustc accept the `#[verify::start_from]` attributes added by the translation patches.
flags = ["-Zcrate-attr=feature(register_tool)", "-Zcrate-attr=register_tool(verify)"]
