  "mysql_common::binlog::trusted",
  # `UserVarEvent` (binlog/events/user_var_event.rs): opaque, because its `value_type` is a
  # `RawConst<i8, constants::ItemResult>` and Aeneas prints `ItemResult`'s negative discriminant
  # as `@[discriminant i8 [-1,0,1,2,3,4]]`, which Lean does not parse.
  "mysql_common::binlog::events::user_var_event",
  # Out of scope: JSONB, JSON diffs and decimals (only their parse/`into_owned` entry points are
  # used, through the helpers of patch 145).
  "mysql_common::binlog::jsonb",
  "mysql_common::binlog::jsondiff",
  "mysql_common::binlog::decimal",
  # `TransactionPayloadEvent::deserialize` (a header loop with `?`/`break` and `format!` errors)
  # and the tagged (MySQL 8.4) GTID format (`str`/UTF-8 validation, `format!` errors, loops with
  # early exits): out of scope, kept as opaque signatures so the dispatch stays translated.
  "{impl mysql_common::proto::MyDeserialize for mysql_common::binlog::events::transaction_payload_event::TransactionPayloadEvent}",
  "mysql_common::binlog::events::gtid_event::_::deserialize_tagged",
  "mysql_common::binlog::events::gtid_event::_::serialize_tagged",
  "mysql_common::binlog::events::gtid_event::_::len_tagged",
  "mysql_common::binlog::events::gtid_event::_::deserialize_tagged_v2",
  "mysql_common::binlog::events::gtid_event::_::write_tagged_fields_v2",
  "mysql_common::binlog::events::gtid_event::_::serialize_tagged_v2",
  "mysql_common::binlog::events::gtid_event::_::len_tagged_v2",
  "mysql_common::binlog::events::gtid_event::read_serialized_uuid",
  "mysql_common::binlog::events::gtid_event::read_varlen_string",
]

[package.metadata.charon.rustc]
# Lets rustc accept the `#[verify::start_from]` attributes added by the translation patches.
flags = ["-Zcrate-attr=feature(register_tool)", "-Zcrate-attr=register_tool(verify)"]
