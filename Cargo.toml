  # 120-124; flate2 goes through the opaque `proto::codec::trusted`, see below). `VecBuf`'s
  # `Clear` impl is marked `#[verify::start_from]`. Out of scope: `sync_framed` (I/O), and the
  # `Debug` derives.
  "mysql_common::proto::codec::compress",
